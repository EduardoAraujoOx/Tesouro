<!doctype html>
<!-- Card de compartilhamento do /painel (WhatsApp, redes): 1200x630. Para regenerar, abra no Chromium em 1200x630 e salve como app/painel/opengraph-image.png.
     Sem números: o painel muda com a PLOA e o card não deve ficar desatualizado. -->
<html lang="pt-BR"><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body { font-family: Inter, sans-serif; background: #082B57; color: #fff; position: relative; overflow: hidden; }
  .faixa { position: absolute; left: 72px; top: 64px; font-size: 26px; letter-spacing: .02em; color: rgba(255,255,255,.75); }
  h1 { position: absolute; left: 72px; top: 130px; width: 760px; margin: 0; font-size: 76px; line-height: 1.04; font-weight: 700; letter-spacing: -.02em; }
  .sub { position: absolute; left: 72px; top: 370px; width: 600px; font-size: 30px; line-height: 1.3; color: rgba(255,255,255,.88); }
  .pe { position: absolute; left: 72px; bottom: 56px; font-size: 24px; color: rgba(255,255,255,.75); }
  .barras { position: absolute; right: 72px; bottom: 96px; width: 380px; height: 330px; display: flex; align-items: flex-end; gap: 22px; }
  .b { flex: 1; background: rgba(255,255,255,.34); border-radius: 6px 6px 0 0; }
  .proj { background: rgba(255,255,255,.14); outline: 2px dashed rgba(255,255,255,.6); outline-offset: -2px; position: relative; }
  .ploa { background: #fff; position: relative; }
  .ploa::before { content: ''; position: absolute; left: -4px; right: -4px; top: 14px; border-top: 4px dashed #C2386F; }
  .base { position: absolute; right: 72px; bottom: 94px; width: 380px; border-top: 2px solid rgba(255,255,255,.5); }
  .rotulos { position: absolute; right: 72px; bottom: 56px; width: 380px; display: flex; gap: 22px; font-size: 20px; color: rgba(255,255,255,.75); }
  .rotulos span { flex: 1; text-align: center; }
</style>
<body>
  <div class="faixa">Equipe de Transição · Espírito Santo</div>
  <h1>Painel orçamentário 2027</h1>
  <div class="sub">PLOA 2027 e projeção de 2026: receita, despesa, resultado, LRF e CAPAG</div>
  <div class="pe">Governador eleito Lorenzo Pazolini</div>
  <div class="barras">
    <div class="b" style="height: 150px"></div>
    <div class="b" style="height: 185px"></div>
    <div class="b" style="height: 235px"></div>
    <div class="b proj" style="height: 270px"></div>
    <div class="b ploa" style="height: 255px"></div>
  </div>
  <div class="base"></div>
  <div class="rotulos"><span>2023</span><span>2024</span><span>2025</span><span>2026</span><span>2027</span></div>
</body></html>

services:
  app:
    build: .
    container_name: tesouro-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tesouro-net

  db:
    image: postgres:16-alpine
    container_name: tesouro-db
    environment:
      POSTGRES_USER: ${DB_USER:-tesouro_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-tesouro_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tesouro_user} -d ${DB_NAME:-tesouro_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tesouro-net

volumes:
  postgres_data:

networks:
  tesouro-net:
    driver: bridge

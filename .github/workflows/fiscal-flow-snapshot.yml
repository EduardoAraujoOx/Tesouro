name: Fiscal flow snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 1-5"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect public fiscal indicators
        run: python fiscal-flow/scripts/collect_fiscal_flow.py

      - name: Commit new snapshot
        shell: bash
        run: |
          if git diff --quiet -- fiscal-flow/data/snapshots && [ -z "$(git status --porcelain fiscal-flow/data/snapshots)" ]; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fiscal-flow/data/snapshots
          git commit -m "Update fiscal-flow snapshot $(date -u +%F)"
          git push
